[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "http-redirect-credential-lab"
version = "0.1.0a1"
description = "FR: Tester les secrets transmis lors de redirections locales | EN: Test secrets forwarded during local redirects | ES: Probar secretos transmitidos en redirecciones locales"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
http-redirect-credential-lab = "http_redirect_credential_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["http_redirect_credential_lab*"]
